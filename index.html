.note{font-size:11.5px;color:var(--sub);margin-top:8px}

// 보유 시세 합 흐름: 기록일마다 보유 카드 시세를 더함 (그 날 기록이 없으면 가장 가까운 이전 기록, 그것도 없으면 첫 기록)
function ownSeries(own){
  const dates = [...new Set(own.flatMap(c=>(c.hist||[]).map(h=>h[0])))].sort();
  return dates.map(d=>{
    let v = 0;
    own.forEach(c=>{ const h=c.hist||[]; let p=null; for(const x of h){ if(x[0]<=d) p=x[1]; } if(p==null && h.length) p=h[0][1]; v += p||0; });
    return [d, v];
  });
}
function lineChart(ser, cost){
  if(ser.length<2) return `<div class="ctl">기록이 1회라 다음 시세 업데이트부터 흐름 그래프가 생겨</div>`;
  const W=320,H=150,L=40,R=12,T=14,B=22;
  const vs = ser.map(s=>s[1]).concat([cost]);
  let mn=Math.min(...vs), mx=Math.max(...vs); const pad=(mx-mn)*0.15||mx*0.05; mn-=pad; mx+=pad;
  const X=i=>L+i*(W-L-R)/(ser.length-1), Y=v=>T+(mx-v)/(mx-mn)*(H-T-B);
  const ticks=[mn+(mx-mn)*0.1, (mn+mx)/2, mx-(mx-mn)*0.1];
  const grid=ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/><text x="${L-6}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${man(Math.round(t/1000)*1000)}</text>`).join("");
  const step=Math.ceil(ser.length/5);
  const xl=ser.map((s,i)=>(i%step===0||i===ser.length-1)?`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${s[0]}</text>`:"").join("");
  const pts=ser.map((s,i)=>`${X(i).toFixed(1)},${Y(s[1]).toFixed(1)}`).join(" ");
  const last=ser[ser.length-1];
  // 끝값 라벨: 점 위에 두되 매입 점선과 겹치면 점선 반대쪽으로
  let endY=Y(last[1])-9; const cy=Y(cost);
  if(Math.abs(endY-3.5-cy)<8) endY = Y(last[1])>cy ? Math.min(Y(last[1])+4, cy+14) : Math.max(Y(last[1])-9, cy-6);
  return `<div class="lc"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="보유 시세 합 흐름: ${ser.map(s=>s[0]+" "+man(s[1])).join(", ")}, 매입 합 ${man(cost)}">
    ${grid}
    <line x1="${L}" x2="${W-R}" y1="${Y(cost).toFixed(1)}" y2="${Y(cost).toFixed(1)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polyline points="${pts}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${ser.map((s,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(s[1]).toFixed(1)}" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/>`).join("")}
    <text x="${(X(ser.length-1)-7).toFixed(1)}" y="${endY.toFixed(1)}" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--ink)" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">${man(last[1])}</text>
    ${xl}
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>
    <rect class="hit" x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent"/>
  </svg></div>
  <div class="cleg"><span><i></i>보유 시세 합</span><span><i class="c"></i>매입 합 ${man(cost)}</span></div>`;
}
function wireLine(box, ser, cost){
  const svg=box.querySelector(".lc svg"); if(!svg) return;
  const tip=box.querySelector(".tip"), xh=svg.querySelector(".xh");
  const W=320,L=40,R=12;
  const show=ev=>{
    const r=svg.getBoundingClientRect(); const x=(ev.clientX-r.left)/r.width*W;
    const i=Math.max(0,Math.min(ser.length-1,Math.round((x-L)/((W-L-R)/(ser.length-1)))));
    const px=L+i*(W-L-R)/(ser.length-1); xh.setAttribute("x1",px); xh.setAttribute("x2",px); xh.setAttribute("visibility","visible");
    const pl=ser[i][1]-cost;
    tip.innerHTML=`<b>${ser[i][0]}</b><br><span class="sw" style="background:var(--s1)"></span>시세 합 ${man(ser[i][1])}<br>매입 합 ${man(cost)}<br>손익 <b>${manS(pl)}</b> (${pct(pl/cost)})`;
    tip.style.display="block";
    const bx=box.getBoundingClientRect(); let left=ev.clientX-bx.left+12; if(left+tip.offsetWidth>bx.width) left=ev.clientX-bx.left-tip.offsetWidth-12;
    tip.style.left=Math.max(4,left)+"px"; tip.style.top="28px";
  };
  const hide=()=>{ tip.style.display="none"; xh.setAttribute("visibility","hidden"); };
  const hit=svg.querySelector(".hit");
  hit.addEventListener("pointermove",show); hit.addEventListener("pointerdown",show);
  // 폰: 손 떼면 pointerleave가 바로 와서 툴팁이 사라지므로 터치는 바깥을 누를 때만 닫음
  hit.addEventListener("pointerleave",e=>{ if(e.pointerType!=="touch") hide(); });
  if(wireLine._off) document.removeEventListener("pointerdown",wireLine._off);
  wireLine._off=e=>{ if(!box.contains(e.target)) hide(); }; document.addEventListener("pointerdown",wireLine._off);
}
function barChart(rows){

    return `<button class="plrow" data-no="${r.c.no}" aria-label="${esc(r.c.name)} 매입 ${won(r.c.buy)}, 시세 ${won(r.c.price)}, 손익 ${sgn(r.pl)}원">
      <span class="n">${esc(short(r.c.name))}</span>
      <span class="t">${r.pl? `<span class="b ${r.pl>0?"pos":"neg"}" style="width:calc(${w}% - 1px)"></span>`:""}</span>
      <span class="v">${manS(r.pl)}</span></button>`;}).join("");
}

   ${rows.length? `<details class="gr" id="gr" ${grOpen?"open":""}><summary>손익 그래프</summary>

     ${rows.map(r=>`<tr><td>${esc(short(r.c.name))}</td><td>${man(r.c.buy)}</td><td>${man(r.c.price)}</td><td>${manS(r.pl)}</td></tr>`).join("")}</table></details>
   </details>`:""}
   <div class="mact"><button id="cpLink">다른 기기로 옮기기 (링크 복사)</button></div>`;
  const gr=$("#gr"); if(gr) gr.addEventListener("toggle",()=>{ grOpen=gr.open; try{localStorage.setItem("pikaGr",grOpen?"1":"0");}catch(e){} });

      ${c.own?'<span class="badge">보유</span>':""}${c.ver==="한글판"?'<span class="ver">한글판</span>':""}</div>
    <div class="meta"><div class="nm">${esc(c.name)}</div><div class="cd">${esc(c.code||c.ver)}${/표본 적음/.test(c.memo||"")?' <span class="low">표본 적음</span>':""}</div>
      <div class="row"><span class="pr">${c.price!=null?man(c.price).replace("만","")+"<small>만</small>":"<small>시세 없음</small>"}</span><span class="chg ${cls(ch)}">${ch==null?"":(Math.abs(ch)<1e-9?"변동 없음":pct(ch))}</span></div>${pl}</div></button>`;
}
function render(){
  let list = CARDS.filter(c=> state.f==="all" || (state.f==="own"?c.own:c.tier===state.f));
  if(state.q) list = list.filter(c=>(c.name+" "+c.code+" "+c.ver).toLowerCase().includes(state.q));
  const P = c => c.price==null ? -1 : c.price;
  const S = {pd:(a,b)=>P(b)-P(a), pa:(a,b)=>(a.price??1e12)-(b.price??1e12), chg:(a,b)=>(chgOf(b)??-9)-(chgOf(a)??-9)||P(b)-P(a), vol:(a,b)=>(b.kCnt||0)-(a.kCnt||0), no:(a,b)=>a.no-b.no}[state.sort];
  list.sort(S);
  $("#count").textContent = `${list.length}장`;
  $("#grid").innerHTML = list.length ? list.map(tile).join("") : `<div class="empty">맞는 카드가 없어</div>`;
}
$("#grid").addEventListener("click", e=>{ const t=e.target.closest(".tile"); if(t) openSheet(+t.dataset.no); });

function spark(h){
  if(!h || h.length<2) return h&&h.length ? `<div class="spark"><span class="lbl">시세 기록 1회 (${h[0][0]}) · 다음 업데이트부터 그래프가 생겨</span></div>` : "";
  const W=300,H=86,px=26,py=16, vs=h.map(x=>x[1]), mn=Math.min(...vs), mx=Math.max(...vs), sp=(mx-mn)||1;
  const X=i=>px+i*(W-2*px)/(h.length-1), Y=v=>H-py-(v-mn)/sp*(H-2*py);
  const pts=h.map((x,i)=>`${X(i).toFixed(1)},${Y(x[1]).toFixed(1)}`).join(" ");
  const dots=h.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x[1])}" r="3.2" fill="var(--ink)"/><text x="${X(i)}" y="${Y(x[1])-7}" text-anchor="middle" font-size="10" fill="var(--sub)">${man(x[1])}</text><text x="${X(i)}" y="${H-1}" text-anchor="middle" font-size="10" fill="var(--sub)">${x[0]}</text>`).join("");
  return `<div class="spark"><span class="lbl">보수 시세 흐름</span><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="시세 흐름"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg></div>`;
}
let pushed=false;
function openSheet(no){
  const c = CARDS.find(x=>x.no===no); if(!c) return;
  const ch = chgOf(c);
  $("#sheet").innerHTML = `<div class="grab"></div>
   <div class="shead"><div><h3 id="stitle">${esc(c.name)}</h3><div class="cd">${esc(c.code||"")} · ${esc(c.ver)} · No.${c.no}</div></div><button class="close" id="xbtn" aria-label="닫기">✕</button></div>
   <div class="sbody"><div class="big">${(c.img||c.alt)?`<img referrerpolicy="no-referrer" class="${kcls(c.img||c.alt,c)}" src="${esc(c.img||c.alt)}" data-alt="${esc(c.img?c.alt||"":"")}" alt="${esc(c.name)}" onerror="imgErr(this)">`:""}<span class="fb">사진 없음</span></div>
   <div><div class="price">${c.price!=null?won(c.price).replace("원","<small>원</small>"):"<small>시세 기록 전</small>"}</div>
    <div class="chg ${cls(ch)}">${ch==null?"":"첫 기록("+c.firstDate.slice(5).replace("-","/")+") 대비 "+(Math.abs(ch)<1e-9?"변동 없음":pct(ch)+" · "+sgn(c.price-c.first)+"원")}</div>
    ${c.own&&c.buy!=null?`<div class="mypl"><span>매입 ${won(c.buy)}</span><strong class="${c.price!=null?cls(c.price-c.buy):"flat"}">${c.price!=null?sgn(c.price-c.buy)+"원":"시세 기록 전"}</strong></div>`:""}
    <div class="ownbox">${c.own
      ? `<label for="buyIn">매입가</label><input id="buyIn" inputmode="numeric" autocomplete="off" value="${c.buy?c.buy.toLocaleString("ko-KR"):""}"><button id="ownSave">저장</button><button id="ownDel" class="alt">보유 해제</button>`
      : `<input id="buyIn" inputmode="numeric" autocomplete="off" placeholder="매입가 (원)" aria-label="매입가"><button id="ownSave">보유에 추가</button><small>이 기기에만 저장돼서 다른 사람한텐 안 보여.</small>`}</div>
    ${spark(c.hist)}
    <dl>
     <dt>크림 최근 체결</dt><dd>${range(c.kLo,c.kHi)}</dd>
     <dt>크림 누적 거래</dt><dd>${c.kCnt!=null?c.kCnt.toLocaleString("ko-KR")+"건":"-"}</dd>
     <dt>번장 판매 (90일)</dt><dd>${c.bN?range(c.bLo,c.bHi)+" · "+c.bN+"건"+(c.bDate&&c.bDate!==c.date.slice(5).replace("-","/")?" ("+c.bDate+" 기록)":""):"-"}</dd>
     <dt>일본 (원 환산)</dt><dd>${range(c.jLo,c.jHi)}${c.jDate&&c.jDate!==c.date.slice(5).replace("-","/")?" ("+c.jDate+" 기록)":""}</dd>
     <dt>최신 기록일</dt><dd>${c.date||"-"}</dd>
    </dl>
    ${c.memo?`<div class="memo">${esc(c.memo)}</div>`:""}
    <div class="btns">${c.kream?`<a class="btn" href="${esc(c.kream)}" target="_blank" rel="noopener">크림에서 보기</a>`:""}${SHEET_URL?`<a class="btn alt" href="${SHEET_URL}" target="_blank" rel="noopener">시트 열기</a>`:""}</div>
   </div></div>`;
  const sc=$("#scrim"), sh=$("#sheet");
  sc.hidden=false; sh.hidden=false; requestAnimationFrame(()=>{sc.classList.add("on"); sh.classList.add("on");});
  sh.scrollTop=0; document.body.style.overflow="hidden";
  $("#xbtn").onclick = closeSheet; $("#xbtn").focus({preventScroll:true});
  const bi=$("#buyIn");
  bi.addEventListener("input",()=>{ const d=bi.value.replace(/\D/g,""); bi.value=d?(+d).toLocaleString("ko-KR"):""; });
  $("#ownSave").onclick=()=>{ const v=+bi.value.replace(/\D/g,""); if(!v){ toast("매입가를 숫자로 넣어줘"); bi.focus(); return; }
    const was=c.own; c.own=true; c.buy=v; const ok=saveOwn(); refreshAll(); openSheet(no);
    toast(ok?(was?"매입가 바꿨어":"보유에 추가했어"):"이 브라우저는 저장이 막혀 있어서 새로고침하면 사라져"); };
  const del=$("#ownDel"); if(del) del.onclick=()=>{ if(del.dataset.arm!=="1"){ del.dataset.arm="1"; del.textContent="한 번 더 누르면 해제"; return; }
    c.own=false; c.buy=null; saveOwn(); refreshAll(); openSheet(no); toast("보유에서 뺐어"); };
  if(!pushed){ try{ history.pushState({sheet:no},""); pushed=true; }catch(e){ pushed=false; } }
}
function hideSheet(){
  const sc=$("#scrim"), sh=$("#sheet"); sc.classList.remove("on"); sh.classList.remove("on");
  document.body.style.overflow=""; setTimeout(()=>{ if(!sh.classList.contains("on")){ sc.hidden=true; sh.hidden=true; } },230);
}
function closeSheet(){ if(pushed){ try{ history.back(); return; }catch(e){} } hideSheet(); }
window.addEventListener("popstate", ()=>{ if(pushed){ pushed=false; hideSheet(); } });
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#sheet").classList.contains("on")) closeSheet(); });

$("#foot").innerHTML = `보수 시세 = 크림 PSA10 최근 체결가 기준 · 번장 = 최근 90일 PSA10 판매 · 일본 = 메루카리·스니덩 원 환산 (11/13은 크림만 갱신, 번장·일본은 마지막 기록일 표시).<br>카드 눌러서 자세히 보고, 폰 뒤로가기 누르면 목록으로 돌아와. 카드 상세에서 매입가를 넣으면 보유로 잡히고, 보유 정보는 이 기기에만 저장돼.${SHEET_URL?` 원본은 <a href="${SHEET_URL}" target="_blank" rel="noopener">구글 시트</a>.`:""}`;
refreshAll();
if(toastMsg) setTimeout(()=>toast(toastMsg), 300);
</script>
</body>
</html>
