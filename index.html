<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>피카츄 PSA10 시세판</title>
<meta name="description" content="피카츄 PSA10 카드 80장 시세 (크림 체결가 기준)">
<meta name="theme-color" content="#f2c200">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23f2c200%22/%3E%3Cpath d=%22M36 6 18 36h12l-4 22 20-32H34z%22 fill=%22%231d1d1f%22/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e6e4de;--acc:#f2c200;--accInk:#3a2e00;--up:#11845b;--down:#d03a2f;--chip:#ecebe6;--ph:#efeee9;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c1f;--ink:#f2f2f3;--sub:#9a9aa2;--line:#2c2c31;--acc:#ffd43b;--accInk:#2a2200;--up:#3ccf8e;--down:#ff6b5e;--chip:#26262b;--ph:#232327;--shadow:none}}
:root[data-theme="dark"]{--bg:#121214;--card:#1c1c1f;--ink:#f2f2f3;--sub:#9a9aa2;--line:#2c2c31;--acc:#ffd43b;--accInk:#2a2200;--up:#3ccf8e;--down:#ff6b5e;--chip:#26262b;--ph:#232327;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:max(10px,env(safe-area-inset-top))}
.ttl{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:19px;margin:0;letter-spacing:-.3px}
h1 b{background:var(--acc);color:var(--accInk);border-radius:6px;padding:1px 6px;font-size:13px;margin-left:6px;vertical-align:2px}
.asof{font-size:12px;color:var(--sub);white-space:nowrap}
.search{margin:10px 0 8px;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:10px 12px 10px 36px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--sub)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;background:var(--chip);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;padding:2px 0 10px;font-size:13px;color:var(--sub)}
.bar select{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.mine{margin:14px 0 4px;background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.mine h2{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between}
.mine h2 span{font-weight:400;color:var(--sub);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:9px 10px}
.stat small{display:block;color:var(--sub);font-size:11.5px}
.stat strong{font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.note{font-size:11.5px;color:var(--sub);margin-top:8px}
main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px 0 24px}
@media (min-width:600px){main{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:860px){main{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1080px){main{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tile{all:unset;cursor:pointer;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
.tile:active{transform:scale(.985)}
.tile:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ph{position:relative;aspect-ratio:5/7;background:var(--ph);display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:contain;padding:8px}
.ph .fb{display:none;font-size:12px;color:var(--sub);text-align:center;padding:12px}
.ph.noimg img{display:none}.ph.noimg .fb{display:block}
.badge{position:absolute;top:8px;left:8px;background:var(--acc);color:var(--accInk);font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.ver{position:absolute;top:8px;right:8px;background:var(--card);color:var(--ink);font-size:10.5px;padding:2px 6px;border-radius:6px;border:1px solid var(--line)}
.meta{padding:9px 10px 11px}
.nm{font-size:13.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.cd{font-size:11.5px;color:var(--sub);margin-top:2px}
.row{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px;gap:6px}
.pr{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.pr small{font-size:12px;font-weight:500;margin-left:1px}
.chg{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--sub)}
.pl{font-size:11.5px;color:var(--sub);margin-top:4px;font-variant-numeric:tabular-nums}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px 0}
footer{font-size:11.5px;color:var(--sub);padding:0 0 calc(28px + env(safe-area-inset-bottom));line-height:1.6}
footer a{color:inherit}
/* detail sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;opacity:0;transition:opacity .18s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .22s ease;padding:8px 16px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet.on{transform:none}
@media (min-width:760px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:640px;border-radius:18px;transform:translate(-50%,-46%);opacity:0;transition:opacity .18s,transform .18s}.sheet.on{transform:translate(-50%,-50%);opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.shead h3{margin:2px 0 2px;font-size:18px;letter-spacing:-.3px}
.close{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none;font-size:18px}
.sbody{display:grid;grid-template-columns:1fr;gap:14px;margin-top:10px}
@media (min-width:760px){.sbody{grid-template-columns:240px 1fr}}
.big{aspect-ratio:5/7;background:var(--ph);border-radius:12px;display:flex;align-items:center;justify-content:center;max-width:210px;width:100%;margin:0 auto}
@media (min-width:760px){.big{max-width:240px}}
.big img{width:100%;height:100%;object-fit:contain;padding:10px}
.big .fb{display:none;color:var(--sub);font-size:13px}.big.noimg img{display:none}.big.noimg .fb{display:block}
.price{font-size:28px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.price small{font-size:15px;font-weight:600}
dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:13.5px}
dt{color:var(--sub)}dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.spark{margin-top:12px;background:var(--bg);border-radius:10px;padding:10px}
.spark svg{width:100%;height:auto;display:block}
.spark .lbl{font-size:11.5px;color:var(--sub)}
.memo{margin-top:10px;font-size:13px;background:var(--bg);border-radius:10px;padding:10px}
.btns{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;text-align:center;text-decoration:none;font-weight:600;font-size:14px;padding:12px;border-radius:12px;background:var(--ink);color:var(--bg)}
.btn.alt{background:var(--chip);color:var(--ink)}
.mypl{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13.5px;display:flex;justify-content:space-between}
</style>
</head>

const SHEET_URL = "";
const TIERS = ["10만 미만","10만대","20만대","30~40만대","50~90만대","100만 이상"];
const $ = s => document.querySelector(s);
const won = p => p==null ? "-" : p.toLocaleString("ko-KR")+"원";
const man = p => { if(p==null) return "-"; const v=p/10000; return (Math.round(v*10)/10).toLocaleString("ko-KR")+"만"; };
const sgn = v => (v>0?"+":"")+v.toLocaleString("ko-KR");
const chgOf = c => (c.price!=null && c.first) ? (c.price/c.first-1) : null;
const pct = v => v==null ? "" : (v>0?"+":"")+(v*100).toFixed(1)+"%";
const cls = v => v==null||Math.abs(v)<1e-9 ? "flat" : (v>0?"up":"down");
const range = (a,b) => a==null ? "-" : (a===b ? won(a) : won(a)+" ~ "+man(b));
const esc = s => String(s??"").replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
let state = {f:"all", q:"", sort:"pd"};
try { const s = JSON.parse(localStorage.getItem("pikaBoard")||"null"); if(s) state = Object.assign(state, s, {q:""}); } catch(e){}
const save = () => { try{ localStorage.setItem("pikaBoard", JSON.stringify({f:state.f, sort:state.sort})); }catch(e){} };

const latest = CARDS.map(c=>c.date).filter(Boolean).sort().pop();
$("#asof").textContent = `기준 ${latest ? latest.slice(5).replace("-","/") : "-"} · ${CARDS.length}장`;

// 보유 요약
(function(){
  const own = CARDS.filter(c=>c.own), priced = own.filter(c=>c.price!=null);
  const ps = priced.reduce((a,c)=>a+c.price,0), bs = priced.reduce((a,c)=>a+(c.buy||0),0), pl = ps-bs;
  const unp = own.filter(c=>c.price==null);
  if(!own.length){ $("#mine").remove(); return; }
  $("#mine").innerHTML = `<h2>내 보유 <span>${own.length}장</span></h2>
   <div class="stats"><div class="stat"><small>시세 합</small><strong>${man(ps)}</strong></div>
   <div class="stat"><small>매입 합</small><strong>${man(bs)}</strong></div>
   <div class="stat"><small>손익</small><strong class="${cls(pl)}">${pl>0?"+":""}${man(pl).replace("-","−")}</strong></div></div>
   ${unp.length? `<div class="note">${unp.map(c=>esc(c.name)+" (매입 "+man(c.buy)+")").join(", ")}은 시세 기록 전이라 합계에서 뺐어.</div>`:""}`;
})();

// 필터 칩
const HAS_OWN = CARDS.some(c=>c.own);
if(!HAS_OWN && state.f==="own") state.f="all";
const chipDefs = [["all","전체"]].concat(HAS_OWN?[["own","보유"]]:[]).concat(TIERS.map(t=>[t,t]));
$("#chips").innerHTML = chipDefs.map(([k,l])=>{
  const n = k==="all"?CARDS.length : k==="own"?CARDS.filter(c=>c.own).length : CARDS.filter(c=>c.tier===k).length;
  return `<button class="chip" data-k="${esc(k)}" aria-pressed="${state.f===k}">${esc(l)} ${n}</button>`;}).join("");
$("#chips").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b) return; state.f=b.dataset.k; save();
  document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", x===b)); render(); });
$("#sort").value = state.sort;
$("#sort").addEventListener("change", e=>{ state.sort=e.target.value; save(); render(); });
$("#q").addEventListener("input", e=>{ state.q=e.target.value.trim().toLowerCase(); render(); });

function tile(c){
  const ch = chgOf(c);
  const pl = c.own && c.buy!=null ? (c.price!=null ? `<div class="pl">매입 ${man(c.buy)} · <span class="${cls(c.price-c.buy)}">${sgn(c.price-c.buy)}원</span></div>` : `<div class="pl">매입 ${man(c.buy)} · 시세 기록 전</div>`) : "";
  return `<button class="tile" data-no="${c.no}" aria-label="${esc(c.name)} 자세히 보기">
    <div class="ph">${c.img?`<img loading="lazy" decoding="async" src="${esc(c.img)}" alt="" onerror="this.parentNode.classList.add('noimg')">`:""}<span class="fb">${esc(c.name)}<br>사진 없음</span>
      ${c.own?'<span class="badge">보유</span>':""}${c.ver==="한글판"?'<span class="ver">한글판</span>':""}</div>
    <div class="meta"><div class="nm">${esc(c.name)}</div><div class="cd">${esc(c.code||c.ver)}</div>
      <div class="row"><span class="pr">${c.price!=null?man(c.price).replace("만","")+"<small>만</small>":"<small>시세 없음</small>"}</span><span class="chg ${cls(ch)}">${ch==null?"":(Math.abs(ch)<1e-9?"변동 없음":pct(ch))}</span></div>${pl}</div></button>`;
}
function render(){
  let list = CARDS.filter(c=> state.f==="all" || (state.f==="own"?c.own:c.tier===state.f));
  if(state.q) list = list.filter(c=>(c.name+" "+c.code+" "+c.ver).toLowerCase().includes(state.q));
  const P = c => c.price==null ? -1 : c.price;
  const S = {pd:(a,b)=>P(b)-P(a), pa:(a,b)=>(a.price??1e12)-(b.price??1e12), chg:(a,b)=>(chgOf(b)??-9)-(chgOf(a)??-9)||P(b)-P(a), vol:(a,b)=>(b.kCnt||0)-(a.kCnt||0), no:(a,b)=>a.no-b.no}[state.sort];
  list.sort(S);
  $("#count").textContent = `${list.length}장`;
  $("#grid").innerHTML = list.length ? list.map(tile).join("") : `<div class="empty">맞는 카드가 없어</div>`;
}
$("#grid").addEventListener("click", e=>{ const t=e.target.closest(".tile"); if(t) openSheet(+t.dataset.no); });

function spark(h){
  if(!h || h.length<2) return h&&h.length ? `<div class="spark"><span class="lbl">시세 기록 1회 (${h[0][0]}) · 다음 업데이트부터 그래프가 생겨</span></div>` : "";
  const W=300,H=86,px=26,py=16, vs=h.map(x=>x[1]), mn=Math.min(...vs), mx=Math.max(...vs), sp=(mx-mn)||1;
  const X=i=>px+i*(W-2*px)/(h.length-1), Y=v=>H-py-(v-mn)/sp*(H-2*py);
  const pts=h.map((x,i)=>`${X(i).toFixed(1)},${Y(x[1]).toFixed(1)}`).join(" ");
  const dots=h.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x[1])}" r="3.2" fill="var(--ink)"/><text x="${X(i)}" y="${Y(x[1])-7}" text-anchor="middle" font-size="10" fill="var(--sub)">${man(x[1])}</text><text x="${X(i)}" y="${H-1}" text-anchor="middle" font-size="10" fill="var(--sub)">${x[0]}</text>`).join("");
  return `<div class="spark"><span class="lbl">보수 시세 흐름</span><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="시세 흐름"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg></div>`;
}
let pushed=false;
function openSheet(no){
  const c = CARDS.find(x=>x.no===no); if(!c) return;
  const ch = chgOf(c);
  $("#sheet").innerHTML = `<div class="grab"></div>
   <div class="shead"><div><h3 id="stitle">${esc(c.name)}</h3><div class="cd">${esc(c.code||"")} · ${esc(c.ver)} · No.${c.no}</div></div><button class="close" id="xbtn" aria-label="닫기">✕</button></div>
   <div class="sbody"><div class="big">${c.img?`<img src="${esc(c.img)}" alt="${esc(c.name)}" onerror="this.parentNode.classList.add('noimg')">`:""}<span class="fb">사진 없음</span></div>
   <div><div class="price">${c.price!=null?won(c.price).replace("원","<small>원</small>"):"<small>시세 기록 전</small>"}</div>
    <div class="chg ${cls(ch)}">${ch==null?"":"첫 기록("+c.firstDate.slice(5).replace("-","/")+") 대비 "+(Math.abs(ch)<1e-9?"변동 없음":pct(ch)+" · "+sgn(c.price-c.first)+"원")}</div>
    ${c.own&&c.buy!=null?`<div class="mypl"><span>매입 ${won(c.buy)}</span><strong class="${c.price!=null?cls(c.price-c.buy):"flat"}">${c.price!=null?sgn(c.price-c.buy)+"원":"시세 기록 전"}</strong></div>`:""}
    ${spark(c.hist)}
    <dl>
     <dt>크림 최근 체결</dt><dd>${range(c.kLo,c.kHi)}</dd>
     <dt>크림 누적 거래</dt><dd>${c.kCnt!=null?c.kCnt.toLocaleString("ko-KR")+"건":"-"}</dd>
     <dt>번장 판매 (90일)</dt><dd>${c.bN?range(c.bLo,c.bHi)+" · "+c.bN+"건"+(c.bDate&&c.bDate!==c.date.slice(5).replace("-","/")?" ("+c.bDate+" 기록)":""):"-"}</dd>
     <dt>일본 (원 환산)</dt><dd>${range(c.jLo,c.jHi)}${c.jDate&&c.jDate!==c.date.slice(5).replace("-","/")?" ("+c.jDate+" 기록)":""}</dd>
     <dt>최신 기록일</dt><dd>${c.date||"-"}</dd>
    </dl>
    ${c.memo?`<div class="memo">${esc(c.memo)}</div>`:""}
    <div class="btns">${c.kream?`<a class="btn" href="${esc(c.kream)}" target="_blank" rel="noopener">크림에서 보기</a>`:""}${SHEET_URL?`<a class="btn alt" href="${SHEET_URL}" target="_blank" rel="noopener">시트 열기</a>`:""}</div>
   </div></div>`;
  const sc=$("#scrim"), sh=$("#sheet");
  sc.hidden=false; sh.hidden=false; requestAnimationFrame(()=>{sc.classList.add("on"); sh.classList.add("on");});
  sh.scrollTop=0; document.body.style.overflow="hidden";
  $("#xbtn").onclick = closeSheet; $("#xbtn").focus({preventScroll:true});
  if(!pushed){ try{ history.pushState({sheet:no},""); pushed=true; }catch(e){ pushed=false; } }
}
function hideSheet(){
  const sc=$("#scrim"), sh=$("#sheet"); sc.classList.remove("on"); sh.classList.remove("on");
  document.body.style.overflow=""; setTimeout(()=>{ if(!sh.classList.contains("on")){ sc.hidden=true; sh.hidden=true; } },230);
}
function closeSheet(){ if(pushed){ try{ history.back(); return; }catch(e){} } hideSheet(); }
window.addEventListener("popstate", ()=>{ if(pushed){ pushed=false; hideSheet(); } });
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#sheet").classList.contains("on")) closeSheet(); });

$("#foot").innerHTML = `보수 시세 = 크림 PSA10 최근 체결가 기준 · 번장 = 최근 90일 PSA10 판매 · 일본 = 메루카리·스니덩 원 환산 (11/13은 크림만 갱신, 번장·일본은 마지막 기록일 표시).<br>카드 눌러서 자세히 보고, 폰 뒤로가기 누르면 목록으로 돌아와.${SHEET_URL?` 원본은 <a href="${SHEET_URL}" target="_blank" rel="noopener">구글 시트</a>.`:""}`;
render();
</script>
</body>
</html>
